<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lease Agreement | Signed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #e2e8f0; height: 100vh; display: flex; flex-direction: column; } 
        .brand { font-family: 'Outfit', sans-serif; }
        .sig-font { font-family: 'Dancing Script', cursive; }
        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #6366f1; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Ensure iframe area takes space even if empty */
        main { flex: 1; min-height: 0; }
        iframe { width: 100%; height: 100%; min-height: 500px; background: white; }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm z-20 flex-none h-16">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded flex items-center justify-center text-white">
                <i class="fas fa-home text-sm"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800 brand">Kozeyy <span class="font-normal text-slate-400 ml-1">Sign</span></h1>
        </div>
        <div id="status-badge" class="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2">
            <span id="status-text">Digital Certificate</span>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Left: PDF Viewer -->
        <main class="flex-1 bg-slate-200 overflow-hidden flex items-center justify-center p-4">
            <div class="w-full h-full max-w-5xl bg-white shadow-xl rounded-lg overflow-hidden border border-slate-300 relative">
                <iframe id="pdf-frame" class="w-full h-full border-none"></iframe>
                
                <!-- Overlay Message (For Loading or Errors) -->
                <div id="overlay-msg" class="absolute inset-0 bg-white z-10 flex flex-col items-center justify-center hidden">
                    <div class="loader mb-4" id="overlay-loader"></div>
                    <p class="text-slate-500 font-bold text-sm" id="overlay-text">Loading Document...</p>
                </div>
            </div>
        </main>

        <!-- Right: Sidebar (Hidden on mobile) -->
        <aside class="w-80 bg-white border-l border-slate-200 overflow-y-auto hidden lg:flex flex-col p-6 shadow-xl z-10">
            <!-- Cert Info -->
            <div class="mb-8">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Signature Certificate</h3>
                <div class="bg-slate-50 rounded-xl p-4 border border-slate-100 mb-2">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Ref ID</p>
                    <p class="text-xs font-mono font-bold text-slate-700 break-all" id="ref-id">...</p>
                </div>
            </div>

            <!-- Signatures -->
            <div class="space-y-6">
                <!-- Tenant -->
                <div class="relative pl-6 border-l-2 border-slate-300" id="tenant-sig-block">
                    <div class="absolute -left-[9px] top-0 w-4 h-4 bg-slate-300 rounded-full border-4 border-white transition-colors" id="tenant-dot"></div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Tenant Signature</p>
                    <h4 class="font-bold text-slate-800 sig-font text-xl" id="t-name">Pending...</h4>
                    <p class="text-[10px] text-slate-500 mt-1 flex items-center gap-1">
                        <i class="fas fa-clock"></i> <span id="t-date">--</span>
                    </p>
                </div>

                <!-- Landlord -->
                <div class="relative pl-6 border-l-2 border-slate-300" id="landlord-sig-block">
                    <div class="absolute -left-[9px] top-0 w-4 h-4 bg-slate-300 rounded-full border-4 border-white transition-colors" id="landlord-dot"></div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Landlord Signature</p>
                    <h4 class="font-bold text-slate-800 sig-font text-xl" id="o-name">Pending...</h4>
                    <p class="text-[10px] text-slate-500 mt-1 flex items-center gap-1">
                        <i class="fas fa-clock"></i> <span id="o-date">--</span>
                    </p>
                </div>
            </div>

            <!-- Footer / QR -->
            <div class="mt-auto pt-8 border-t border-slate-100">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 text-center">Verification Seal</h3>
                <div id="qrcode" class="mx-auto mb-3 flex justify-center p-2 bg-white border border-slate-100 shadow-sm w-32 h-32 items-center"></div>
                <p class="text-[10px] text-slate-400 text-center leading-relaxed mb-6">
                    Scan to verify document authenticity.<br>Secured by Kozeyy.
                </p>
                <button onclick="window.print()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold text-sm hover:bg-slate-900 transition flex items-center justify-center gap-2">
                    <i class="fas fa-print"></i> Print Receipt
                </button>
            </div>
        </aside>
    </div>

    <script>
        // --- 1. CONFIG ---
        const S_URL = 'https://xhufxnqfflnzlqhzhtaz.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhodWZ4bnFmZmxuemxxaHpodGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3NTkwMjUsImV4cCI6MjA3OTMzNTAyNX0.YXbjjLf90j6kGIwDVcZcJ8Cp0979acu3-OooNJ4hrmE';
        
        let supabase = null;
        if (window.supabase) supabase = window.supabase.createClient(S_URL, S_KEY);

        const params = new URLSearchParams(window.location.search);

        // --- 2. HELPERS ---
        function formatDate(iso) {
            if (!iso || iso === 'null' || iso === 'undefined') return '--';
            const d = new Date(iso);
            return isNaN(d.getTime()) ? '--' : d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }

        // Safe function to update UI that won't crash if data is missing
        function updateSigUI(type, name, date) {
            const block = document.getElementById(`${type}-sig-block`);
            const dot = document.getElementById(`${type}-dot`);
            const nameEl = document.getElementById(`${type.charAt(0)}-name`);
            const dateEl = document.getElementById(`${type.charAt(0)}-date`);

            if(nameEl) nameEl.innerText = name || 'Pending...';
            if(dateEl) dateEl.innerText = formatDate(date);

            // Only mark as signed if we have a valid date
            if (date && date !== 'null' && date !== '--') {
                if(block) {
                    block.classList.remove('border-slate-300');
                    block.classList.add('border-indigo-500');
                }
                if(dot) {
                    dot.classList.remove('bg-slate-300');
                    dot.classList.add('bg-indigo-500');
                }
                
                // Landlord gets Emerald if signed
                if (type === 'landlord') {
                    if(block) { block.classList.remove('border-indigo-500'); block.classList.add('border-emerald-500'); }
                    if(dot) { dot.classList.remove('bg-indigo-500'); dot.classList.add('bg-emerald-500'); }
                }
            }
        }

        function generateQR(id) {
            try {
                const container = document.getElementById("qrcode");
                if(!container) return;
                container.innerHTML = ""; // Clear
                const url = `${window.location.origin}${window.location.pathname}?id=${id}`;
                new QRCode(container, {
                    text: url,
                    width: 110,
                    height: 110,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.Q
                });
            } catch(e) {
                console.warn("QR Error:", e);
            }
        }

        // --- 3. MAIN LOGIC ---
        async function init() {
            const docId = params.get('id');
            const manualUrl = params.get('url');

            // CASE A: Direct Access via Dashboard (Params exist)
            if (manualUrl) {
                document.getElementById('pdf-frame').src = manualUrl;
                document.getElementById('ref-id').innerText = (docId || 'LEGACY').slice(0,18);
                
                updateSigUI('tenant', params.get('t_name'), params.get('t_date'));
                updateSigUI('landlord', params.get('o_name'), params.get('o_date'));
                
                generateQR(docId);
                return;
            }

            // CASE B: QR Code Scan (Only ID exists)
            if (docId && supabase) {
                const overlay = document.getElementById('overlay-msg');
                const overlayText = document.getElementById('overlay-text');
                const overlayLoader = document.getElementById('overlay-loader');
                
                overlay.classList.remove('hidden'); // Show loading

                try {
                    // Try fetching from Tenant Table
                    let { data: t, error } = await supabase
                        .from('tenants')
                        .select('*, owners(name)')
                        .eq('id', docId)
                        .maybeSingle();

                    // Fallback: Try Apps Table
                    if (!t) {
                        const { data: a } = await supabase.from('apps').select('*').eq('id', docId).maybeSingle();
                        if(a) t = a; // Normalize
                    }

                    if (t && t.lease_url) {
                        // Success: Load Data
                        document.getElementById('pdf-frame').src = t.lease_url;
                        document.getElementById('ref-id').innerText = t.id.slice(0, 8).toUpperCase();
                        
                        // Hide Overlay
                        overlay.classList.add('hidden');

                        const tDate = t.lease_signed_at || t.tenant_signed_at;
                        updateSigUI('tenant', t.name, tDate);
                        
                        let oName = "Landlord";
                        if(t.owners && t.owners.name) oName = t.owners.name;
                        updateSigUI('landlord', oName, t.owner_signed_at);

                        // Update Status Badge if fully signed
                        if(tDate && t.owner_signed_at) {
                            const badge = document.getElementById('status-badge');
                            const badgeText = document.getElementById('status-text');
                            badge.className = "bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2";
                            badgeText.innerHTML = '<i class="fas fa-check-circle"></i> Executed';
                        }

                        generateQR(docId);

                    } else {
                        // Not Found
                        overlayText.innerText = "Document Not Found or Access Denied";
                        overlayLoader.style.display = 'none';
                    }
                } catch (err) {
                    console.error(err);
                    overlayText.innerText = "Verification Error";
                    overlayLoader.style.display = 'none';
                }
            } else {
                // No ID provided
                document.getElementById('overlay-msg').classList.remove('hidden');
                document.getElementById('overlay-text').innerText = "Invalid Document Link";
                document.getElementById('overlay-loader').style.display = 'none';
            }
        }

        // Run when DOM is ready
        window.onload = init;
    </script>
</body>
</html>
