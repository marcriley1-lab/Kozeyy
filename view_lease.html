<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lease Agreement | Signed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Include Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #e2e8f0; } 
        .brand { font-family: 'Outfit', sans-serif; }
        .sig-font { font-family: 'Dancing Script', cursive; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold"><i class="fas fa-file-contract"></i></div>
            <div>
                <h1 class="text-lg font-bold text-slate-800 brand">Lease Agreement</h1>
                <p class="text-xs text-slate-500">Digital Document Viewer</p>
            </div>
        </div>
        <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-900 transition">
            <i class="fas fa-print mr-2"></i> Print / Save
        </button>
    </nav>

    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- PDF Viewer -->
        <div class="flex-1 bg-slate-500 relative">
            <iframe id="pdf-frame" class="w-full h-full border-none" src=""></iframe>
        </div>

        <!-- Signature Certificate Sidebar -->
        <div class="w-full md:w-80 bg-white border-l border-slate-200 overflow-y-auto shadow-xl z-20">
            <div class="p-6">
                <div class="mb-6 pb-6 border-b border-slate-100">
                    <span id="executed-badge" class="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
                        <i class="fas fa-clock mr-1"></i> Checking Status
                    </span>
                    <h2 class="text-xl font-bold text-slate-800 mt-4 brand">Signature Certificate</h2>
                    <p class="text-xs text-slate-400 mt-1">Ref ID: <span id="ref-id" class="font-mono">...</span></p>
                </div>

                <div class="space-y-6">
                    <!-- Tenant Sig -->
                    <div class="relative pl-4 border-l-2 border-slate-200">
                        <div class="absolute -left-[9px] top-0 w-4 h-4 bg-indigo-600 rounded-full border-2 border-white"></div>
                        <p class="text-xs font-bold text-slate-400 uppercase mb-1">Tenant Signature</p>
                        <p class="font-bold text-slate-800 text-lg sig-font" id="t-name">...</p>
                        <div class="text-xs text-slate-500 mt-1 bg-slate-50 p-2 rounded border border-slate-100">
                            <i class="fas fa-clock mr-1"></i> Signed: <br>
                            <span id="t-date" class="font-mono font-bold text-[11px]">Loading...</span>
                        </div>
                    </div>

                    <!-- Owner Sig -->
                    <div class="relative pl-4 border-l-2 border-slate-200">
                        <div class="absolute -left-[9px] top-0 w-4 h-4 bg-slate-800 rounded-full border-2 border-white"></div>
                        <p class="text-xs font-bold text-slate-400 uppercase mb-1">Landlord Signature</p>
                        <p class="font-bold text-slate-800 text-lg sig-font" id="o-name">...</p>
                        <div class="text-xs text-slate-500 mt-1 bg-slate-50 p-2 rounded border border-slate-100">
                            <i class="fas fa-clock mr-1"></i> Signed: <br>
                            <span id="o-date" class="font-mono font-bold text-[11px]">Loading...</span>
                        </div>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                    <img id="verification-qr" src="" class="w-24 h-24 mx-auto mb-3 shadow-sm border border-slate-100 p-1 bg-white" alt="Verification QR">
                    <p class="text-[10px] text-slate-400 leading-tight">
                        Scan to verify document authenticity.<br>
                        This document is digitally secured by Kozeyy.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xhufxnqfflnzlqhzhtaz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhodWZ4bnFmZmxuemxxaHpodGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3NTkwMjUsImV4cCI6MjA3OTMzNTAyNX0.YXbjjLf90j6kGIwDVcZcJ8Cp0979acu3-OooNJ4hrmE';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const params = new URLSearchParams(window.location.search);
        const tenantId = params.get('id');
        const leaseUrl = params.get('url');

        // Robust Date Formatting
        const formatDate = (iso) => {
            if (!iso || iso === 'null') return 'Pending Signature';
            const d = new Date(iso);
            return isNaN(d.getTime()) ? 'Pending Signature' : d.toLocaleString();
        };

        async function loadLeaseData() {
            // 1. Set PDF Source immediately from URL
            if (leaseUrl) document.getElementById('pdf-frame').src = leaseUrl;
            
            // 2. Initial UI setup from URL params (as backup)
            document.getElementById('ref-id').innerText = tenantId ? tenantId.slice(0,8).toUpperCase() : 'UNKNOWN';
            document.getElementById('t-name').innerText = params.get('t_name') || 'Tenant';
            document.getElementById('o-name').innerText = params.get('o_name') || 'Landlord';

            // 3. Fetch Fresh Data from Database
            if (tenantId) {
                const { data, error } = await supabase
                    .from('tenants')
                    .select('lease_signed_at, owner_signed_at, name')
                    .eq('id', tenantId)
                    .single();

                if (data) {
                    document.getElementById('t-date').innerText = formatDate(data.lease_signed_at);
                    document.getElementById('o-date').innerText = formatDate(data.owner_signed_at);
                    
                    // Update Badge if both have signed
                    if (data.lease_signed_at && data.owner_signed_at) {
                        const badge = document.getElementById('executed-badge');
                        badge.className = "bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide";
                        badge.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Executed';
                    }
                } else {
                    // Fallback to URL params if DB fetch fails
                    document.getElementById('t-date').innerText = formatDate(params.get('t_date'));
                    document.getElementById('o-date').innerText = formatDate(params.get('o_date'));
                }
            }

            // 4. Generate QR Code
            const qrEl = document.getElementById('verification-qr');
            qrEl.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}`;
        }

        window.onload = loadLeaseData;
    </script>
</body>
</html>
