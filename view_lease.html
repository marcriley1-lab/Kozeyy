<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lease Agreement | Signed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background: #e2e8f0; } 
        .brand { font-family: 'Outfit', sans-serif; }
        .sig-font { font-family: 'Dancing Script', cursive; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded flex items-center justify-center text-white">
                <i class="fas fa-home text-sm"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800 brand">Kozeyy <span class="font-normal text-slate-400 ml-1">Sign</span></h1>
        </div>
        <div id="executed-badge" class="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
            Digital Certificate
        </div>
    </nav>

    <div class="flex-1 flex overflow-hidden">
        <main class="flex-1 bg-slate-200 overflow-hidden flex items-center justify-center p-4 md:p-8">
            <div class="w-full h-full max-w-5xl bg-white shadow-2xl rounded-lg overflow-hidden border border-slate-300">
                <iframe id="pdf-frame" class="w-full h-full border-none" src=""></iframe>
            </div>
        </main>

        <aside class="w-80 bg-white border-l border-slate-200 overflow-y-auto hidden lg:flex flex-col p-6 shadow-xl">
            <div class="mb-8">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Signature Certificate</h3>
                <div class="bg-slate-50 rounded-xl p-4 border border-slate-100 mb-2">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Ref ID</p>
                    <p class="text-sm font-mono font-bold text-slate-700" id="ref-id">...</p>
                </div>
            </div>

            <div class="space-y-6">
                <div class="relative pl-6 border-l-2 border-indigo-500">
                    <div class="absolute -left-[9px] top-0 w-4 h-4 bg-indigo-500 rounded-full border-4 border-white"></div>
                    <p class="text-[10px] font-black text-indigo-500 uppercase tracking-wider mb-1">Tenant Signature</p>
                    <h4 class="font-bold text-slate-800 sig-font text-xl" id="t-name">...</h4>
                    <p class="text-[10px] text-slate-500 mt-1 flex items-center gap-1">
                        <i class="fas fa-clock"></i> <span id="t-date">...</span>
                    </p>
                </div>

                <div class="relative pl-6 border-l-2 border-slate-300" id="landlord-sig-block">
                    <div class="absolute -left-[9px] top-0 w-4 h-4 bg-slate-300 rounded-full border-4 border-white" id="landlord-dot"></div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Landlord Signature</p>
                    <h4 class="font-bold text-slate-800 sig-font text-xl" id="o-name">...</h4>
                    <p class="text-[10px] text-slate-500 mt-1 flex items-center gap-1">
                        <i class="fas fa-clock"></i> <span id="o-date">...</span>
                    </p>
                </div>
            </div>

            <div class="mt-auto pt-8 border-t border-slate-100">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 text-center">Verification Seal</h3>
                <div id="qrcode" class="mx-auto mb-3 p-2 bg-white border border-slate-100 shadow-sm w-[112px] h-[112px] flex items-center justify-center"></div>
                <p class="text-[10px] text-slate-400 text-center leading-relaxed mb-6">
                    Scan to verify document authenticity.<br>This document is digitally secured by Kozeyy.
                </p>
                
                <button onclick="window.print()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold text-sm hover:bg-slate-900 transition flex items-center justify-center gap-2">
                    <i class="fas fa-print"></i> Print Receipt
                </button>
            </div>
        </aside>
    </div>

    <script>
        const S_URL = 'https://xhufxnqfflnzlqhzhtaz.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhodWZ4bnFmZmxuemxxaHpodGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3NTkwMjUsImV4cCI6MjA3OTMzNTAyNX0.YXbjjLf90j6kGIwDVcZcJ8Cp0979acu3-OooNJ4hrmE';
        const params = new URLSearchParams(window.location.search);

        const formatDate = (iso) => {
            if (!iso || iso === 'null' || iso === 'undefined') return 'Pending Signature';
            const d = new Date(iso);
            return isNaN(d.getTime()) ? 'Pending Signature' : d.toLocaleString();
        };

        function generateQR() {
            const qrContainer = document.getElementById("qrcode");
            if (!qrContainer) return;
            qrContainer.innerHTML = "";

            // Use a clean URL for the scanner
            const currentUrl = new URL(window.location.href);
            const cleanUrl = currentUrl.origin + currentUrl.pathname + currentUrl.search;

            try {
                new QRCode(qrContainer, {
                    text: cleanUrl.trim(), // Remove hidden spaces
                    width: 96,
                    height: 96,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M // Medium correction level for easier scanning
                });
            } catch (err) {
                console.error("QR Error:", err);
            }
        }

        function initialRender() {
            document.getElementById('pdf-frame').src = params.get('url') || '';
            document.getElementById('ref-id').innerText = params.get('id') ? params.get('id').slice(0,8).toUpperCase() : 'UNKNOWN';
            document.getElementById('t-name').innerText = params.get('t_name') || 'Tenant';
            document.getElementById('o-name').innerText = params.get('o_name') || 'Landlord';
            document.getElementById('t-date').innerText = formatDate(params.get('t_date'));
            document.getElementById('o-date').innerText = formatDate(params.get('o_date'));
            
            // Allow DOM to breathe before generating QR
            setTimeout(generateQR, 200);
        }

        async function fetchFreshData() {
            const tenantId = params.get('id');
            if (!tenantId || !window.supabase) return;
            try {
                const supabase = window.supabase.createClient(S_URL, S_KEY);
                const { data, error } = await supabase.from('tenants').select('lease_signed_at, owner_signed_at').eq('id', tenantId).maybeSingle();
                if (data && !error) {
                    document.getElementById('t-date').innerText = formatDate(data.lease_signed_at);
                    document.getElementById('o-date').innerText = formatDate(data.owner_signed_at);
                    if (data.lease_signed_at && data.owner_signed_at) {
                        const badge = document.getElementById('executed-badge');
                        badge.className = "bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide";
                        badge.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Executed';
                        document.getElementById('landlord-sig-block').classList.replace('border-slate-300', 'border-indigo-500');
                        document.getElementById('landlord-dot').classList.replace('bg-slate-300', 'bg-indigo-500');
                    }
                }
            } catch (err) { console.warn("DB update failed."); }
        }

        window.onload = () => {
            initialRender();
            fetchFreshData();
        };
    </script>
</body>
</html>
