<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account | Kozeyy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .brand-font { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="flex justify-center mb-4">
                <svg width="48" height="48" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="6" width="10" height="28" rx="2" fill="#4f46e5" />
                    <path d="M18 18L30 6H34C35.1046 6 36 6.89543 36 8V10L22 22H18V18Z" fill="#4f46e5" fill-opacity="0.8" />
                    <path d="M22 24L36 38V40C36 41.1046 35.1046 42 34 42H30L18 30V24H22Z" transform="translate(0 -2)" fill="#4f46e5" fill-opacity="0.9" />
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 brand-font">Join Kozeyy</h1>
            <p class="text-slate-500 mt-2">The modern way to manage and live.</p>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <label id="role-owner-box" onclick="setRole('owner')" class="cursor-pointer p-4 rounded-2xl border-2 border-indigo-600 bg-indigo-600 text-white transition-all text-center">
                    <input type="radio" name="role" id="role-owner" class="hidden" checked>
                    <i class="fas fa-building mb-2 block text-xl"></i>
                    <span class="text-xs font-bold uppercase tracking-wider">Landlord</span>
                </label>
                <label id="role-tenant-box" onclick="setRole('tenant')" class="cursor-pointer p-4 rounded-2xl border-2 border-slate-100 bg-white text-slate-400 hover:border-indigo-200 transition-all text-center">
                    <input type="radio" name="role" id="role-tenant" class="hidden">
                    <i class="fas fa-user-home mb-2 block text-xl"></i>
                    <span class="text-xs font-bold uppercase tracking-wider">Resident</span>
                </label>
            </div>

            <form onsubmit="handleSignup(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase ml-1 mb-1">Full Name</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase ml-1 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="name@email.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase ml-1 mb-1">Create Password</label>
                    <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="••••••••">
                </div>

                <button type="submit" id="btn-signup" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 transition flex items-center justify-center shadow-lg shadow-indigo-200 brand-font group">
                    Create Account
                    <i class="fas fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500">Already have an account? <a href="login.html" class="text-indigo-600 font-bold hover:underline">Log In</a></p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xhufxnqfflnzlqhzhtaz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhodWZ4bnFmZmxuemxxaHpodGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3NTkwMjUsImV4cCI6MjA3OTMzNTAyNX0.YXbjjLf90j6kGIwDVcZcJ8Cp0979acu3-OooNJ4hrmE';
        const supabase = netlify = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRole = 'owner';

        function setRole(role) {
            currentRole = role;
            const ownerBox = document.getElementById('role-owner-box');
            const tenantBox = document.getElementById('role-tenant-box');

            if (role === 'owner') {
                ownerBox.className = 'cursor-pointer p-4 rounded-2xl border-2 border-indigo-600 bg-indigo-600 text-white transition-all text-center';
                tenantBox.className = 'cursor-pointer p-4 rounded-2xl border-2 border-slate-100 bg-white text-slate-400 hover:border-indigo-200 transition-all text-center';
            } else {
                tenantBox.className = 'cursor-pointer p-4 rounded-2xl border-2 border-indigo-600 bg-indigo-600 text-white transition-all text-center';
                ownerBox.className = 'cursor-pointer p-4 rounded-2xl border-2 border-slate-100 bg-white text-slate-400 hover:border-indigo-200 transition-all text-center';
            }
        }

        function checkRole() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            if (role === 'tenant') {
                const radio = document.getElementById('role-tenant');
                if (radio) radio.checked = true;
                setRole('tenant');
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-signup');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // 1. Auth Signup
                const { data: authData, error: authError } = await supabase.auth.signUp({ 
                    email, 
                    password,
                    options: { data: { full_name: name, role: currentRole } } 
                });
                if (authError) throw authError;

                // 2. Profile Creation
                const table = currentRole === 'owner' ? 'owners' : 'tenants';
                const { error: profileError } = await supabase.from(table).insert([{
                    id: authData.user.id,
                    name: name,
                    email: email,
                    status: 'Active'
                }]);
                if (profileError) throw profileError;

                localStorage.setItem('kozeyy_user_id', authData.user.id);

                // 3. Dynamic Redirection
                if (currentRole === 'tenant') {
                    window.location.href = 'tenant.html';
                } else {
                    window.location.href = 'owner.html';
                }

            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerHTML = 'Create Account <i class="fas fa-arrow-right ml-2"></i>';
            }
        }

        // Trigger visual highlight immediately upon window load
        window.addEventListener('load', () => {
            checkRole();
        });
    </script>
</body>
</html>
